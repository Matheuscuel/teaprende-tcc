services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: tea_system
      POSTGRES_USER: tea
      POSTGRES_PASSWORD: tea
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: node:18-alpine
    working_dir: /app
    depends_on:
      - db
    environment:
      NODE_ENV: development
      PORT: 3001
      # deixe T O D A S as variantes, seu código pode ler qualquer uma delas
      DATABASE_URL: postgres://tea:tea@db:5432/tea_system
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: tea
      DB_PASSWORD: tea
      DB_NAME: tea_system
      DB_DATABASE: tea_system
      PGHOST: db
      PGPORT: "5432"
      PGUSER: tea
      PGPASSWORD: tea
      PGDATABASE: tea_system
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./backend:/app
    ports:
      - "3001:3001"
    command: >
      sh -lc "npm install --legacy-peer-deps &&
              npx knex migrate:latest --knexfile knexfile.js &&
              npx knex seed:run --knexfile knexfile.js &&
              node src/server.js"

  web:
    image: node:20
    working_dir: /app
    depends_on:
      - api
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - NEXT_PUBLIC_API_BASE=http://localhost:3001/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app        # <- monta o código do host
      - /app/node_modules
    command: npm run dev

volumes:
  pgdata:
